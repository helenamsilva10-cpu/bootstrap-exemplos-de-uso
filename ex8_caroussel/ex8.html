<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!--Construindo Slider "Carrousel" do zero-->
<div class="container mt 3">
    <div class="carrousel slide" data-bs-ride="carousel">
       <div class="carousel-inner">
       <!-- Primeiro item do Carrousel -->
        <div class="carousel-item active">
            <img src="https://placehold.co/600x400" alt="Slide-1" Class="d.block w-100">
        </div>

        <!-- Segundo item do Carrousel-->
          <div class="carousel-item active">
            <img src="https://placehold.co/600x400" alt="Slide-2" Class="d.block w-100">
        </div>

        <!-- Terceiro item do Carrousel-->
 <div class="carousel-item active">
            <img src="https://placehold.co/600x400" alt="Slide-3" Class="d.block w-100">
        </div>
         

    
        <!-- Adicionando Botões de controle do Carrousel-->
         <button class="carrousel control prev" type="button" data-bs-target="#carouselExemplo"data-bs-slide="prev">
            <span class=""
         </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
